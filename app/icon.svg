<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Bevu Social Farmstay favicon: neem tree over farmhouse, earthy palette -->
  <circle cx="32" cy="32" r="30" fill="#FAF5EA" stroke="#4A5D33" stroke-width="2"/>
  <!-- ground -->
  <path d="M8 46 Q32 41 56 46 L56 47 Q32 43 8 47 Z" fill="#4A5D33"/>
  <!-- house body -->
  <rect x="26" y="33" width="22" height="12" rx="0.5" fill="#F3E9D6" stroke="#9C5B33" stroke-width="1"/>
  <!-- roof -->
  <path d="M24 34 L37 25 L50 34 Z" fill="#B0552B"/>
  <path d="M24 34 L50 34 L49 31.5 L25 31.5 Z" fill="#9C4A24"/>
  <!-- door -->
  <rect x="34.5" y="37" width="5" height="8" fill="#3E5A2E"/>
  <!-- windows -->
  <rect x="28.5" y="37.5" width="4" height="4" fill="#5A7240"/>
  <rect x="41.5" y="37.5" width="4" height="4" fill="#5A7240"/>
  <!-- tree trunk -->
  <path d="M18 46 C19 38 17 32 14 26 M18 46 C18.5 38 21 33 25 28" stroke="#3F4A26" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- tree canopy -->
  <g fill="#5C7A36">
    <ellipse cx="13" cy="22" rx="7" ry="5.5"/>
    <ellipse cx="23" cy="17" rx="8" ry="6"/>
    <ellipse cx="34" cy="15" rx="7" ry="5"/>
    <ellipse cx="20" cy="25" rx="6" ry="4.5"/>
  </g>
  <g fill="#79954A">
    <ellipse cx="17" cy="19" rx="5" ry="4"/>
    <ellipse cx="28" cy="14" rx="5.5" ry="4"/>
    <ellipse cx="38" cy="17" rx="4.5" ry="3.5"/>
  </g>
  <!-- sun -->
  <circle cx="48" cy="22" r="4.5" fill="#E8D4AE"/>
</svg>
