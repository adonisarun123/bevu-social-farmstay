<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Bevu Social Farmstay neem tree emblem" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#243149"/>
      <stop offset="60%" stop-color="#1a2336"/>
      <stop offset="100%" stop-color="#0e141f"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4d49a"/>
      <stop offset="100%" stop-color="#e7b35e"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e7b35e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e7b35e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leafA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#aeb878"/>
      <stop offset="100%" stop-color="#7c8a55"/>
    </linearGradient>
    <linearGradient id="leafB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a9a5e"/>
      <stop offset="100%" stop-color="#5f6e40"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0673c"/>
      <stop offset="100%" stop-color="#8a4327"/>
    </linearGradient>
    <clipPath id="round"><circle cx="120" cy="120" r="112"/></clipPath>
  </defs>

  <!-- badge -->
  <circle cx="120" cy="120" r="116" fill="url(#bg)"/>
  <g clip-path="url(#round)">
    <!-- sun glow + disc -->
    <circle cx="120" cy="150" r="92" fill="url(#sunGlow)"/>
    <circle cx="120" cy="156" r="58" fill="url(#sun)" opacity="0.92"/>

    <!-- earth mound -->
    <ellipse cx="120" cy="214" rx="120" ry="36" fill="#132020" fill-opacity="0.6"/>
    <ellipse cx="120" cy="214" rx="120" ry="30" fill="#1d2c1d"/>
    <path d="M120 198 q-26 6 -52 4 M120 198 q26 6 52 4" stroke="#4d5e3a" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.7"/>

    <!-- trunk + branches -->
    <path d="M111 206 C108 184 108 168 115 150 C117 144 119 140 119 132 C119 140 121 144 123 150 C130 168 130 184 127 206 Z" fill="url(#trunk)"/>
    <g stroke="url(#trunk)" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M119 150 C112 138 100 130 90 124"/>
      <path d="M120 146 C128 134 140 128 150 122"/>
      <path d="M120 150 C120 138 120 128 120 116"/>
    </g>

    <!-- canopy: deep base layer -->
    <g fill="url(#leafB)">
      <circle cx="120" cy="92" r="48"/>
      <circle cx="82" cy="106" r="31"/>
      <circle cx="158" cy="106" r="31"/>
      <circle cx="98" cy="66" r="27"/>
      <circle cx="144" cy="66" r="27"/>
      <circle cx="120" cy="56" r="26"/>
      <circle cx="64" cy="116" r="20"/>
      <circle cx="176" cy="116" r="20"/>
    </g>
    <!-- canopy: light layer (light from upper-left) -->
    <g fill="url(#leafA)">
      <circle cx="112" cy="84" r="40"/>
      <circle cx="80" cy="98" r="24"/>
      <circle cx="96" cy="62" r="22"/>
      <circle cx="120" cy="54" r="20"/>
      <circle cx="138" cy="64" r="18"/>
    </g>
    <!-- gold rim light hugging canopy crown -->
    <g fill="none" stroke="#f1cf93" stroke-width="2.4" stroke-linecap="round" opacity="0.8">
      <path d="M104 38 q16 -7 33 0"/>
      <path d="M74 60 q4 -12 18 -19"/>
      <path d="M150 56 q9 -11 -2 -22"/>
    </g>
    <!-- depth dabs -->
    <g fill="#4a5732" opacity="0.55">
      <circle cx="132" cy="118" r="13"/>
      <circle cx="100" cy="120" r="11"/>
      <circle cx="150" cy="100" r="9"/>
    </g>
    <!-- tiny falling leaves -->
    <g fill="#aeb878" opacity="0.9">
      <path d="M58 150 q6 -4 10 2 q-6 4 -10 -2 Z"/>
      <path d="M182 158 q6 -4 10 2 q-6 4 -10 -2 Z" opacity="0.8"/>
    </g>
  </g>

  <!-- rings -->
  <circle cx="120" cy="120" r="116" fill="none" stroke="#e7b35e" stroke-width="3"/>
  <circle cx="120" cy="120" r="108" fill="none" stroke="#e7b35e" stroke-width="1" opacity="0.5"/>
</svg>